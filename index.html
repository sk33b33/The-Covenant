<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <title>The Covenant</title>
    <meta
      name="description"
      content="The Covenant — a trading card game drawn from scripture. Collect the faithful, build your deck, and contend for the covenant."
    />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f6f1e6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17130d" media="(prefers-color-scheme: dark)" />

    <!-- Standalone iOS launch: no browser chrome, status bar over our art. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="The Covenant" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="icon" href="/icons/icon-192.png" />

    <link
      rel="preload"
      href="/fonts/cinzel-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
